<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冷门食物 · 证据分级</title>
<style>
  :root{
    --bg:#fafaf7; --card:#fff; --ink:#1f1f1d; --muted:#6b6b66; --line:#e7e6e0;
    --green:#2e7d32; --green-bg:#eef6ee;
    --amber:#b26a00; --amber-bg:#fbf3e6;
    --red:#c0392b;   --red-bg:#fbeceb;
    --focus:#1a73c2;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:960px; margin:0 auto; padding:28px 18px 60px}
  header h1{font-size:1.55rem; margin:0 0 6px; letter-spacing:.5px}
  header .sub{color:var(--muted); margin:0; font-size:.95rem}
  .disclaimer{color:var(--muted); font-size:.8rem; margin:14px 0 0; border-left:3px solid var(--line); padding:4px 0 4px 10px}
  .vh{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}

  .controls{margin:22px 0 18px; display:flex; flex-direction:column; gap:10px}
  .search input{width:100%; font:inherit; font-size:.95rem; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:#fff}
  .fgroup{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
  .glab{font-size:.78rem; color:var(--muted); min-width:64px; font-weight:600}
  .fgroup button{font:inherit; font-size:.84rem; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); padding:6px 12px; border-radius:999px; transition:.15s}
  .fgroup button:hover{border-color:#cfcfc8}
  .fgroup button.active{background:var(--ink); color:#fff; border-color:var(--ink)}
  .utility{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:2px}
  .viewtoggle{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
  .utility button{font:inherit; font-size:.84rem; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); padding:6px 12px; border-radius:8px; transition:.15s}
  .utility button:hover{border-color:#cfcfc8}
  .utility button.active{background:var(--ink); color:#fff; border-color:var(--ink)}
  .utility .ghost{color:var(--muted)}
  .profile{margin:2px 0 0; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff}
  .profile .fgroup + .fgroup{margin-top:8px}
  .profile button{font:inherit; font-size:.84rem; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); padding:6px 12px; border-radius:999px; transition:.15s}
  .profile button.active{background:var(--ink); color:#fff; border-color:var(--ink)}
  .profile-results{display:none; grid-template-columns:1fr; gap:10px; margin-top:12px}
  .profile-results.show{display:grid}
  .utility .toggle.has-active{border-color:var(--ink); font-weight:600}
  .utility .push-right{margin-left:auto}
  .cnt{font-variant-numeric:tabular-nums}
  .collapsible{display:none}
  #more-filters.open{display:flex; flex-direction:column; gap:10px; margin-top:2px}
  #profile-panel.open{display:block}
  .profile-intro{margin:0 0 10px; font-size:.82rem; color:var(--muted)}
  @media(min-width:760px){.profile-results{grid-template-columns:1fr 1fr 1fr}}
  .screen-col{border-top:1px dashed var(--line); padding-top:10px}
  .screen-col h3{font-size:.84rem; margin:0 0 6px; color:var(--muted)}
  .screen-list{display:flex; flex-direction:column; gap:6px}
  .screen-item{padding:8px 9px; background:#fafaf7; border-radius:8px; font-size:.82rem}
  .screen-item b{display:block; font-size:.9rem; color:var(--ink)}
  .screen-item span{display:block; color:var(--muted); line-height:1.45}
  :focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:6px}

  .count{font-size:.8rem; color:var(--muted); margin:0 0 12px}
  .summary{display:flex; flex-wrap:wrap; gap:6px; margin:-4px 0 12px}
  .summary:empty{display:none}
  .summary span{font-size:.74rem; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:#555}
  .grid{display:grid; grid-template-columns:1fr; gap:16px}
  @media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
  .card{background:var(--card); border:1px solid var(--line); border-left-width:5px; border-radius:12px; padding:18px}
  .card.t-green{border-left-color:var(--green)} .card.t-amber{border-left-color:var(--amber)} .card.t-red{border-left-color:var(--red)}
  .card.hide{display:none}
  .top{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
  .head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end}
  .card h2{font-size:1.18rem; margin:0}
  .badge{font-size:.72rem; padding:3px 9px; border-radius:999px; white-space:nowrap; font-weight:600}
  .t-green .badge{background:var(--green-bg); color:var(--green)} .t-amber .badge{background:var(--amber-bg); color:var(--amber)} .t-red .badge{background:var(--red-bg); color:var(--red)}
  .compare-toggle{font:inherit; font-size:.76rem; cursor:pointer; border:1px solid var(--line); border-radius:7px; padding:3px 8px; background:#fff; color:var(--muted)}
  .compare-toggle.active{background:var(--ink); color:#fff; border-color:var(--ink)}
  .verdict{margin:10px 0 4px; font-size:1.02rem}
  .hook{margin:4px 0 12px; font-size:.86rem; padding:7px 10px 7px 13px; border-left:3px solid #f0c040; background:#fefce8; border-radius:0 8px 8px 0; color:#6b5500; line-height:1.5}
  body.compact .hook{display:none}

  .tags{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px}
  .tag{font-size:.72rem; padding:2px 8px; border-radius:6px; background:#eef0ef; color:#444}
  .tag.risk{background:#fbeceb; color:var(--red)}
  .tag.action{font-weight:700}
  .tag.action.a-green{background:var(--green-bg); color:var(--green)}
  .tag.action.a-amber{background:var(--amber-bg); color:var(--amber)}
  .tag.action.a-red{background:var(--red-bg); color:var(--red)}
  .claims{margin:12px 0; display:flex; flex-direction:column; gap:8px}
  .claim{border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:#fff; font-size:.86rem}
  .claim .ctop{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:4px}
  .claim b{font-size:.88rem}
  .claim p{margin:0; color:#37372f}
  .claim-badge{font-size:.68rem; font-weight:700; border-radius:999px; padding:2px 7px}
  .claim-badge.green{background:var(--green-bg); color:var(--green)}
  .claim-badge.amber{background:var(--amber-bg); color:var(--amber)}
  .claim-badge.red{background:var(--red-bg); color:var(--red)}

  .row{margin:9px 0; font-size:.92rem}
  .row .lab{display:block; font-weight:600; font-size:.82rem; margin-bottom:2px}
  .row.good .lab{color:var(--green)} .row.warn .lab{color:var(--amber)} .row.hype .lab{color:var(--red)}
  .row p{margin:0; color:#37372f}

  .use{margin:14px 0 0; padding:12px 12px 8px; background:#f6f6f2; border-radius:10px; font-size:.88rem}
  .use .lab{font-weight:700; font-size:.82rem; display:block; margin-bottom:6px}
  .use dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 10px}
  .use dt{color:var(--muted); white-space:nowrap; font-size:.82rem}
  .use dd{margin:0; color:#37372f}
  .inter{margin:10px 0 0; padding:10px 12px; background:#fff7f3; border:1px solid #f3ddd2; border-radius:10px; font-size:.86rem}
  .inter .lab{font-weight:700; font-size:.82rem; display:block; margin-bottom:4px; color:#b2480d}
  .inter p{margin:0; color:#37372f}

  .ev{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-size:.83rem}
  .ev .lab{font-weight:600; color:var(--muted); display:block; margin-bottom:6px}
  .evchips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px}
  .evchip{font-size:.7rem; font-variant-numeric:tabular-nums; padding:2px 7px; border:1px solid var(--line); border-radius:5px; background:#fff; color:#555}
  .ev a{color:#0a6; text-decoration:none; border-bottom:1px solid #bde6d3}
  .ev a:hover{background:#eafaf2}
  .ev .secondary{color:var(--muted); font-size:.78rem; margin-top:5px}
  .ev .srcline{margin:4px 0; line-height:1.6}
  .acc{display:inline-block; font-size:.66rem; padding:1px 6px; border-radius:5px; margin-left:6px; white-space:nowrap; vertical-align:1px}
  .acc.free{background:#eef6ee; color:#2e7d32}
  .acc.abs{background:#eef0f6; color:#41557a}
  .acc.pay{background:#f7efe9; color:#9a5b3b}
  .acc.sec{background:#f0f0ec; color:#666}
  .srcq{font-size:.68rem; padding:1px 7px; border-radius:999px; margin-left:8px; font-weight:600; white-space:nowrap}
  .srcq.q1{background:#eef6ee; color:#2e7d32}
  .srcq.q2{background:#fbf3e6; color:#b26a00}
  .muted{color:var(--muted)}

  .compare-panel{display:none; margin:0 0 16px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff}
  .compare-panel.show{display:block}
  .panel-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
  .panel-head strong{font-size:.92rem}
  .panel-head span{font-size:.8rem; color:var(--muted)}
  .panel-head button{font:inherit; font-size:.82rem; border:1px solid var(--line); background:#fff; color:var(--muted); padding:5px 10px; border-radius:8px; cursor:pointer}
  .compare-scroll{overflow-x:auto}
  .compare-table{width:100%; min-width:680px; border-collapse:collapse; font-size:.82rem}
  .compare-table th,.compare-table td{border-top:1px solid var(--line); padding:8px; vertical-align:top; text-align:left}
  .compare-table th:first-child{width:92px; color:var(--muted); font-weight:600}
  .compare-table thead th{border-top:0; color:var(--ink)}

  body.compact .card{padding:14px}
  body.compact .row, body.compact .use, body.compact .inter{display:none}
  body.compact .tags{margin-bottom:10px}
  body.compact .ev{margin-top:10px; padding-top:10px}
  body.compact .ev .lab, body.compact .ev .srcline{display:none}
  body.compact .evchips{margin-bottom:0}

  #noresults{display:none; text-align:center; color:var(--muted); padding:40px 0}
  #noresults button{font:inherit; margin-left:8px; border:1px solid var(--line); background:#fff; color:var(--ink); padding:5px 10px; border-radius:8px; cursor:pointer}
  footer{margin-top:34px; color:var(--muted); font-size:.8rem; text-align:center}
  code{background:#f0f0ec; padding:1px 5px; border-radius:4px; font-size:.85em}
  @media(max-width:520px){
    .top{align-items:flex-start; flex-direction:column; gap:6px}
    .head{justify-content:flex-start}
    .badge{white-space:normal}
    .glab{width:100%; min-width:0}
    .utility{align-items:stretch}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>冷门食物 · 证据分级</h1>
    <p class="sub">网红/冷门食物，查完证据后哪个真有用、哪个是智商税、该怎么吃。</p>
    <p class="disclaimer">⚠️ 做着玩的小工具。结论按公开证据的读数写，能核实的研究才标年份/类型/样本量/效应；核不到精确数字的只写结论 + 真实出处，不编。<b>不替代医生 / 营养师判断。</b></p>
  </header>

  <div class="controls">
    <div class="search">
      <label for="q" class="vh">搜索食物或关键词</label>
      <input id="q" type="search" placeholder="🔍 搜索食物或关键词（如 血糖、孕妇、华法林、胶原）…" autocomplete="off">
    </div>
    <div class="fgroup" data-group="tier" role="group" aria-label="按证据等级筛选">
      <span class="glab">证据</span>
      <button data-g="tier" data-v="all" class="active" aria-pressed="true">全部</button>
      <button data-g="tier" data-v="green" aria-pressed="false">🟢 比较扎实</button>
      <button data-g="tier" data-v="amber" aria-pressed="false">🟡 有营养但有坑</button>
      <button data-g="tier" data-v="red" aria-pressed="false">🔴 大头是营销</button>
    </div>
    <div class="utility">
      <button type="button" id="toggle-filters" class="toggle" aria-expanded="false" aria-controls="more-filters">⚙ 更多筛选<span id="filter-count" class="cnt"></span></button>
      <button type="button" id="toggle-profile" class="toggle" aria-expanded="false" aria-controls="profile-panel">🎯 按我的情况看</button>
      <div class="viewtoggle push-right" role="group" aria-label="切换卡片显示密度">
        <button type="button" data-mode="full" class="active" aria-pressed="true">完整</button>
        <button type="button" data-mode="compact" aria-pressed="false">紧凑</button>
      </div>
      <button type="button" id="clear" class="ghost">清空</button>
      <button type="button" id="copylink" class="ghost">复制链接</button>
    </div>
    <div id="more-filters" class="collapsible">
      <div class="fgroup" data-group="target" role="group" aria-label="按目标筛选">
        <span class="glab">目标</span>
        <button data-g="target" data-v="all" class="active" aria-pressed="true">全部</button>
      </div>
      <div class="fgroup" data-group="risk" role="group" aria-label="按谨慎人群筛选">
        <span class="glab">谨慎人群</span>
        <button data-g="risk" data-v="all" class="active" aria-pressed="true">全部</button>
      </div>
    </div>
    <section class="profile collapsible" id="profile-panel" aria-label="个人筛查">
      <p class="profile-intro">选你的目标和身体情况，自动分成「值得优先看 / 谨慎·先问医生 / 别为功效花钱」三组。</p>
      <div class="fgroup profile-target" role="group" aria-label="我的目标">
        <span class="glab">我的目标</span>
        <button type="button" data-profile-target="all" class="active" aria-pressed="true">全部</button>
      </div>
      <div class="fgroup profile-risks" role="group" aria-label="我的情况">
        <span class="glab">我的情况</span>
      </div>
      <div class="profile-results" id="profile-results" aria-live="polite"></div>
    </section>
  </div>

  <p class="count" id="count" role="status" aria-live="polite"></p>
  <div class="summary" id="summary" aria-live="polite"></div>
  <section class="compare-panel" id="compare-panel" aria-label="食物对比">
    <div class="panel-head">
      <div><strong>对比</strong> <span id="compare-count"></span></div>
      <button type="button" id="clear-compare">清空对比</button>
    </div>
    <div class="compare-scroll" id="compare-table"></div>
  </section>
  <main class="grid" id="grid"></main>
  <p id="noresults">没有匹配的食物。换个筛选或清空搜索试试。<button type="button" id="clear-empty">清空</button></p>

  <footer>
    <span id="total"></span> 食物 · 加食物：在 <code>FOODS</code> 数组里加一条对象即可，筛选按钮会自动出现。
  </footer>
</div>

<script>
const FOODS = [
  {
    name:"红菜根", tier:"green",
    verdict:"这几样里证据最稳的——降血压是真的，幅度温和。",
    targets:["血压","运动表现"], risks:["肾结石"],
    good:"含膳食硝酸盐，进体内转成一氧化氮、让血管舒张。多项系统综述/meta 一致显示能温和降低血压；另有提升耐力运动表现的研究。",
    warn:"草酸偏高，有肾结石史的人注意量。吃后尿、便变红是甜菜红素正常现象，不是出血。",
    hype:'"排毒""抗癌神器""一杯逆转高血压"。降压是温和辅助，不替代药物。',
    use:{freq:"研究多用约 250–500 ml 甜菜根汁或等量根菜，可日常吃。", scene:"高血压辅助、耐力运动前。", caution:"肾结石病史者控制量。"},
    evChips:["2022/24","系统综述·meta","收缩压 ≈ −5 mmHg（高血压）"],
    links:[{label:"Frontiers in Nutrition（2022）：甜菜根降血压 meta", url:"https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2022.823039/full"}],
    secondary:{text:"二级参考：", label:"Examine 硝酸盐", url:"https://examine.com/supplements/nitrate/", tail:"（2024 一项 11 试验/349 人，收缩压 −5.3 mmHg）"}
  },
  {
    name:"西兰花芽苗", tier:"green",
    verdict:"有真科学（萝卜硫素），但效果温和且有条件——别神化。",
    targets:["血糖"], risks:["孕妇","甲状腺"],
    good:"富含萝卜硫素，激活 Nrf2 抗氧化/解毒通路；芽苗浓度高于成熟西兰花。在 2 型糖尿病有 RCT 证据。",
    warn:'效果温和且有条件：2017 RCT 只在"肥胖+血糖控制差"亚组降了血糖；2025 一项预糖尿病 RCT 未达主要终点，效果还取决于肠道菌群。研究用的是高浓度提取物，吃菜 ≠ 吃提取物。',
    hype:'"抗癌""万能解毒""自闭症神药"——从早期/小样本外推过头。',
    use:{freq:'当蔬菜日常吃即可，没有公认"治疗剂量"。', scene:"想多摄入十字花科/萝卜硫素的人。", caution:"生芽苗有沙门氏菌风险，孕妇/免疫低下者避免生食；甲状腺问题者大量生吃十字花科需留意。"},
    evChips:["2017 RCT n=97","仅亚组 ↓ 血糖","2025 RCT n=74 未达主要终点"],
    links:[{label:"Science Transl. Med.（2017）", url:"https://www.science.org/doi/10.1126/scitranslmed.aah4477"},{label:"Nature Microbiology（2025）", url:"https://www.nature.com/articles/s41564-025-01932-w"}],
    secondary:{text:"二级参考：", label:"Examine 萝卜硫素", url:"https://examine.com/supplements/sulforaphane/"}
  },
  {
    name:"纳豆", tier:"green",
    verdict:"维生素 K2 的最强食物来源，骨骼有料，心血管证据混合。",
    targets:["关节骨骼","心血管"], risks:["抗凝/手术"],
    good:"发酵大豆，MK-7 型维生素 K2 含量极高（~775µg/100g，远超其他食物）。K2 参与激活骨钙素，3 年 RCT（375µg/日）改善骨代谢；观察性研究中 K2 摄入高与冠脉钙化/心血管死亡更低相关。",
    warn:"心血管的 RCT 结果混合，目前不足以把它当护心补剂。最要紧：维生素 K 对抗华法林等抗凝药，吃华法林的人不要突然吃纳豆或改变摄入量。",
    hype:'"纳豆激酶溶血栓""逆转动脉硬化"——人体证据远没到这一步。',
    use:{freq:"当发酵豆制品日常吃没问题。", scene:"想补 K2/骨骼健康、喜欢发酵食品的人。", caution:"服华法林等抗凝药者务必先问医生，别自行增减。"},
    evChips:["MK-7 ~775µg/100g","骨骼 RCT 375µg/日·3年","心血管证据混合"],
    links:[{label:"PMC：纳豆/MK-7 与骨密度 meta", url:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12699326/"}],
    secondary:{text:"抗凝相互作用：", label:"低 MK-7 纳豆 × 华法林临床试验", url:"https://www.liebertpub.com/doi/10.1089/jmf.2021.0036"}
  },
  {
    name:"亚麻籽", tier:"green",
    verdict:"降血压的证据在这堆里算很硬的一个。",
    targets:["血压","心血管"], risks:["抗凝/手术"],
    good:"富含 α-亚麻酸（植物 omega-3）、木酚素和纤维。RCT meta 显示降血压：一项 5 RCT meta 在高血压人群收缩压 −8.6/舒张 −4.9 mmHg；更大范围 18 RCT 约 −4.8 mmHg。对血脂也有改善。",

// 出处可读性（信任信号，不改变链接指向）：按域名判断点开能不能免费读到原文。
function srcAccess(url){
  const u=String(url||"");
  if(u.includes("examine.com")) return {cls:"sec", label:"二级参考"};
  if(["pmc.ncbi.nlm.nih.gov","ncbi.nlm.nih.gov/pmc","ncbi.nlm.nih.gov/books","ods.od.nih.gov","nccih.nih.gov","frontiersin.org","nutritionsource.hsph.harvard.edu","drugs.com"].some(d=>u.includes(d))) return {cls:"free", label:"免费可读"};
  if(u.includes("pubmed.ncbi.nlm.nih.gov")||u.includes("cochranelibrary.com")) return {cls:"abs", label:"摘要免费"};
  return {cls:"pay", label:"摘要·全文多付费"};
}

function srcRank(u){ const h=linkHost(u); if(SRC_TIER1.some(d=>h===d||h.endsWith("."+d))) return 1; if(SRC_TIER2.some(d=>h===d||h.endsWith("."+d))) return 2; return 0; }
function trustedUrl(u){ const h=linkHost(u); return /^https:\/\//.test(u||"") && !!h && TRUSTED_HOSTS.some(d=>h===d||h.endsWith("."+d)); }
function actionFor(f){return ACTION_BY_TIER[f.tier] || {label:"先读证据", cls:""};}
function claimHTML(claims){
  if(!claims || !claims.length) return "";
  return `<div class="claims">${claims.map(c=>`<div class="claim">
    <div class="ctop"><span class="claim-badge ${c.tier}">${CLAIM_LABEL[c.tier] || c.tier}</span><b>${esc(c.title)}</b></div>
    <p>${esc(c.text)}</p>
  </div>`).join("")}</div>`;
}

function cardHTML(f){
  const tv = f.targetVerb || "针对";
  const action = actionFor(f);
  const tags = [
    `<span class="tag action ${action.cls}">${esc(action.label)}</span>`,
    ...f.targets.map(t=>`<span class="tag">${tv} ${esc(t)}</span>`),
    ...f.risks.map(r=>`<span class="tag risk">谨慎 ${esc(r)}</span>`)
  ].join("");
  const chips = (f.evChips||[]).map(c=>`<span class="evchip">${esc(c)}</span>`).join("");
  const accChip = u=>{const a=srcAccess(u); return `<span class="acc ${a.cls}">${a.label}</span>`;};
  const links = f.links.map(l=>`<div class="srcline"><a href="${attr(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a>${accChip(l.url)}</div>`).join("");
  const sec = f.secondary ? `<div class="srcline secondary">${esc(f.secondary.text)}<a href="${attr(f.secondary.url)}" target="_blank" rel="noopener noreferrer">${esc(f.secondary.label)}</a>${esc(f.secondary.tail||"")}${accChip(f.secondary.url)}</div>` : "";
  const hype = f.hypeHtml || esc(f.hype || "");
  return `<article class="card t-${f.tier}" data-name="${attr(f.name)}">
    <div class="top"><h2>${esc(f.name)}</h2><div class="head"><span class="badge">${TIER_LABEL[f.tier]}</span><button type="button" class="compare-toggle" data-compare="${attr(f.name)}" aria-pressed="false">对比</button></div></div>
    <p class="verdict">${esc(f.verdict)}</p>
    ${f.hook ? `<p class="hook">💡 ${esc(f.hook)}</p>` : ""}
    <div class="tags">${tags}</div>
    ${claimHTML(f.claims)}
    <div class="row good"><span class="lab">✅ 真实好处</span><p>${esc(f.good)}</p></div>
    <div class="row warn"><span class="lab">⚠️ 坑与风险</span><p>${esc(f.warn)}</p></div>
    <div class="row hype"><span class="lab">🚫 被过度营销的说法</span><p>${hype}</p></div>
    <div class="use"><span class="lab">🍽 怎么用</span><dl>
      <dt>频率/份量</dt><dd>${esc(f.use.freq)}</dd>
      ${f.dose?`<dt>剂量·见效</dt><dd>${esc(f.dose)}</dd>`:""}
      <dt>适合场景</dt><dd>${esc(f.use.scene)}</dd>
      <dt>谨慎人群</dt><dd>${esc(f.use.caution)}</dd>
    </dl></div>
    ${f.interactions?`<div class="inter"><span class="lab">⚡ 和药/食物的冲突</span><p>${esc(f.interactions)}</p></div>`:""}
    <div class="ev"><span class="lab">📚 证据出处 · 点开读原文</span><span class="srcq ${(f.links||[]).some(l=>srcRank(l.url)===1)?"q1":"q2"}">${(f.links||[]).some(l=>srcRank(l.url)===1)?"有一手证据":"待补一手源"}</span>
      <div class="evchips">${chips}</div>
      ${links}
      ${sec}
    </div>
  </article>`;
}

function orderedLabels(kind, order){
  const set = new Set();
  FOODS.forEach(f => (kind==="target"?f.targets:f.risks).forEach(v=>set.add(v)));
  return order.filter(x=>set.has(x)).concat([...set].filter(x=>!order.includes(x)));
}

function buildFilterButtons(g, order){
  const ordered = orderedLabels(g, order);
  const container = document.querySelector(`.fgroup[data-group="${g}"]`);
  ordered.forEach(v=>{
    const b = document.createElement("button");
    b.dataset.g = g; b.dataset.v = v;
    b.dataset.label = v;
    b.setAttribute("aria-pressed","false");
    b.textContent = v;
    container.appendChild(b);
  });
}

function buildProfileButtons(){
  const targetBox = document.querySelector(".profile-target");
  orderedLabels("target", TARGET_ORDER).forEach(v=>{
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.profileTarget = v;
    b.setAttribute("aria-pressed", "false");
    b.textContent = v;
    targetBox.appendChild(b);
  });
  const riskBox = document.querySelector(".profile-risks");
  orderedLabels("risk", RISK_ORDER).forEach(v=>{
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.profileRisk = v;
    b.setAttribute("aria-pressed", "false");
    b.textContent = v;
    riskBox.appendChild(b);
  });
}

function rememberButtonLabels(){
  document.querySelectorAll(".fgroup button").forEach(b=>{
    b.dataset.label = b.dataset.label || b.textContent.trim();
  });
}

function validateData(){
  const validTiers = new Set(Object.keys(TIER_LABEL));
  const seen = new Set();
  FOODS.forEach((f,i)=>{
    const label = `FOODS[${i}] ${f.name || "(未命名)"}`;
    if(!f.name) console.warn(label, "缺 name");
    if(seen.has(f.name)) console.warn("重复食物名：", f.name);
    seen.add(f.name);
    if(!validTiers.has(f.tier)) console.warn(label, "tier 无效：", f.tier);
    if(!Array.isArray(f.targets)) console.warn(label, "targets 应为数组");
    if(!Array.isArray(f.risks)) console.warn(label, "risks 应为数组");
    if(!f.good || !f.warn || !(f.hype || f.hypeHtml) || !f.verdict) console.warn(label, "缺少核心文案字段");
    if(!f.use || !f.use.freq || !f.use.scene || !f.use.caution) console.warn(label, "use 字段不完整");
    (f.claims || []).forEach(c=>{
      if(!c.title || !c.text || !validTiers.has(c.tier)) console.warn(label, "claims 字段不完整：", c);
    });
    if(!Array.isArray(f.links) || f.links.length===0) console.warn(label, "缺 links");
    (f.links || []).forEach(l=>{
      if(!l.label) console.warn(label, "出处缺 label：", l);
      else if(!trustedUrl(l.url)) console.warn(label, "出处链接非 https 或域名不在可信名单：", l.url);
    });
    const ranks = (f.links || []).map(l=>srcRank(l.url));
    if(ranks.length && !ranks.includes(1)) console.warn(label, "⚠ 主张仅靠二级/科普来源支撑，建议补一手文献：", (f.links||[]).map(l=>l.url).join(" "));
    if(f.secondary && !trustedUrl(f.secondary.url)) console.warn(label, "二级参考链接非 https 或域名不可信：", f.secondary.url);
  });
}

// render
validateData();
const grid = document.getElementById("grid");
grid.innerHTML = FOODS.map(cardHTML).join("");
buildFilterButtons("target", TARGET_ORDER);
buildFilterButtons("risk", RISK_ORDER);
buildProfileButtons();
rememberButtonLabels();
document.getElementById("total").textContent = FOODS.length;

// 过滤/搜索基于数据而非渲染出的 DOM 文本：每个食物预计算一次小写 search 串，
// 只含食物数据（名称/结论/好处/风险/标签/剂量/相互作用/证据标签），
// 不含 ✅真实好处、📚证据 这类每张卡都重复的 UI 文案。卡片与 FOODS 同序，按下标配对。
const cardEls = Array.from(grid.querySelectorAll(".card"));
const model = FOODS.map((f,i)=>({
  el: cardEls[i],
  food: f,
  tier: f.tier,
  targets: f.targets,
  risks: f.risks,
  search: [f.name, f.verdict, f.good, f.warn, (f.hypeHtml || f.hype || "").replace(/<[^>]+>/g," "),
           f.dose||"", f.interactions||"", f.targets.join(" "), f.risks.join(" "),
           (f.use?[f.use.freq,f.use.scene,f.use.caution].join(" "):""),
           (f.evChips||[]).join(" "), (f.claims||[]).map(c=>`${c.title} ${c.text}`).join(" ")].join(" ").toLowerCase()
}));

const foodByName = new Map(FOODS.map(f=>[f.name, f]));
const state = {tier:"all", target:"all", risk:"all", q:"", mode:"full", profileTarget:"all", profileRisks:[], compare:[]};
const noResults = document.getElementById("noresults");
const countEl = document.getElementById("count");
const summaryEl = document.getElementById("summary");
const profileResults = document.getElementById("profile-results");
const comparePanel = document.getElementById("compare-panel");
const compareTable = document.getElementById("compare-table");
const compareCount = document.getElementById("compare-count");
const qInput = document.getElementById("q");
const clearBtn = document.getElementById("clear");
const clearEmptyBtn = document.getElementById("clear-empty");
const copyBtn = document.getElementById("copylink");
const clearCompareBtn = document.getElementById("clear-compare");
const viewButtons = Array.from(document.querySelectorAll(".viewtoggle button"));
const compareButtons = Array.from(document.querySelectorAll(".compare-toggle"));

function matches(m, overrides={}){
  const tier = overrides.tier ?? state.tier;
  const target = overrides.target ?? state.target;
  const risk = overrides.risk ?? state.risk;
  const q = String(overrides.q ?? state.q).trim().toLowerCase();
  return (tier==="all" || m.tier===tier)
    && (target==="all" || m.targets.includes(target))
    && (risk==="all" || m.risks.includes(risk))
    && (q==="" || m.search.includes(q));
}

function setGroup(g, value){
  const group = document.querySelector(`.fgroup[data-group="${g}"]`);
  if(!group) return;
  const buttons = Array.from(group.querySelectorAll("button"));
  const next = buttons.some(b=>b.dataset.v===value) ? value : "all";
  state[g] = next;
  buttons.forEach(b=>{
    const on = b.dataset.v===next;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
}

function setMode(mode){
  state.mode = mode==="compact" ? "compact" : "full";
  document.body.classList.toggle("compact", state.mode==="compact");
  viewButtons.forEach(b=>{
    const on = b.dataset.mode===state.mode;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
}

function setProfileTarget(value){
  const buttons = Array.from(document.querySelectorAll("[data-profile-target]"));
  const next = buttons.some(b=>b.dataset.profileTarget===value) ? value : "all";
  state.profileTarget = next;
  buttons.forEach(b=>{
    const on = b.dataset.profileTarget===next;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
}

function toggleProfileRisk(value){
  state.profileRisks = state.profileRisks.includes(value)
    ? state.profileRisks.filter(x=>x!==value)
    : state.profileRisks.concat(value);
  document.querySelectorAll("[data-profile-risk]").forEach(b=>{
    const on = state.profileRisks.includes(b.dataset.profileRisk);
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
}

function updateFilterCounts(){
  document.querySelectorAll(".fgroup button[data-g]").forEach(btn=>{
    const g = btn.dataset.g;
    const value = btn.dataset.v;
    const n = model.reduce((sum,m)=>sum + (matches(m, {[g]: value}) ? 1 : 0), 0);
    btn.textContent = `${btn.dataset.label} ${n}`;
    btn.setAttribute("aria-label", `${btn.dataset.label}，${n} 种食物`);
  });
}

function updateSummary(){
  const parts = [];
  if(state.tier!=="all") parts.push(TIER_LABEL[state.tier]);
  if(state.target!=="all") parts.push(`目标：${state.target}`);
  if(state.risk!=="all") parts.push(`谨慎：${state.risk}`);
  if(state.q.trim()) parts.push(`搜索：${state.q.trim()}`);
  summaryEl.innerHTML = parts.map(p=>`<span>${esc(p)}</span>`).join("");
}

function tierValue(t){return t==="green" ? 0 : t==="amber" ? 1 : 2;}
function terse(s, n=58){return s.length>n ? `${s.slice(0,n)}…` : s;}
function screenItem(f, note){
  return `<div class="screen-item"><b>${esc(f.name)}</b><span>${esc(note)}</span></div>`;
}

// 按所选目标的「有效证据档」：若该食物有匹配此目标的 claim（如椰子油漱口→口腔、牛骨汤助眠→睡眠），
// 用 claim 的档而不是食物总档，避免「红档食物的某个真实窄用途」被一刀切到「不为功效买」。
function effTier(f, goal){
  if(goal && goal!=="all" && Array.isArray(f.claims)){
    const c = f.claims.find(c=>c.goal===goal);
    if(c) return c.tier;
  }
  return f.tier;
}
function actionForGoal(f, goal){ return ACTION_BY_TIER[effTier(f, goal)] || {label:"先读证据", cls:""}; }
function renderProfile(){
  const active = state.profileTarget!=="all" || state.profileRisks.length>0;
  profileResults.classList.toggle("show", active);
  if(!active){
    profileResults.innerHTML = "";
    return;
  }
  const target = state.profileTarget;
  const risks = state.profileRisks;
  const targetHit = f => target==="all" || f.targets.includes(target);
  const riskHits = f => risks.filter(r=>f.risks.includes(r));
  const et = f => effTier(f, target);
  const priority = FOODS
    .filter(f => targetHit(f) && riskHits(f).length===0 && et(f)!=="red")
    .sort((a,b)=>tierValue(et(a))-tierValue(et(b)) || a.name.localeCompare(b.name, "zh-Hans-CN"))
    .slice(0,5);
  const cautious = FOODS
    .map(f=>({f, hits:riskHits(f)}))
    .filter(x => x.hits.length && (target==="all" || x.f.targets.includes(target) || et(x.f)!=="red"))
    .sort((a,b)=>tierValue(et(b.f))-tierValue(et(a.f)) || a.f.name.localeCompare(b.f.name, "zh-Hans-CN"))
    .slice(0,5);
  const lowValue = FOODS
    .filter(f => targetHit(f) && riskHits(f).length===0 && et(f)==="red")
    .sort((a,b)=>a.name.localeCompare(b.name, "zh-Hans-CN"))
    .slice(0,5);
  const empty = `<div class="screen-item"><span>暂无匹配</span></div>`;
  profileResults.innerHTML = `
    <section class="screen-col"><h3>优先看</h3><div class="screen-list">${priority.map(f=>screenItem(f, `${actionForGoal(f, target).label} · ${terse(f.verdict)}`)).join("") || empty}</div></section>
    <section class="screen-col"><h3>谨慎/先问</h3><div class="screen-list">${cautious.map(x=>screenItem(x.f, `命中：${x.hits.join("、")} · ${terse(x.f.use.caution)}`)).join("") || empty}</div></section>
    <section class="screen-col"><h3>不为功效买</h3><div class="screen-list">${lowValue.map(f=>screenItem(f, terse(f.verdict))).join("") || empty}</div></section>
  `;
}

function updateCompareButtons(){
  compareButtons.forEach(btn=>{
    const on = state.compare.includes(btn.dataset.compare);
    btn.classList.toggle("active", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.textContent = on ? "已选" : "对比";
  });
}

function compareCell(f, key){
  if(key==="action") return actionFor(f).label;
  if(key==="claims") return (f.claims || []).map(c=>`${c.title}：${CLAIM_LABEL[c.tier] || c.tier}`).join(" / ") || "未分用途";
  if(key==="tier") return TIER_LABEL[f.tier];
  if(key==="targets") return f.targets.join("、") || "无";
  if(key==="risks") return f.risks.join("、") || "无";
  if(key==="dose") return f.dose || f.use.freq;
  if(key==="interactions") return f.interactions || "无明确冲突";
  if(key==="evidence") return (f.evChips||[]).join(" / ");
  return f[key] || "";
}

function renderCompare(){
  const foods = state.compare.map(n=>foodByName.get(n)).filter(Boolean);
  comparePanel.classList.toggle("show", foods.length>0);
  compareCount.textContent = foods.length ? `${foods.length} / 4` : "";
  updateCompareButtons();
  if(!foods.length){
    compareTable.innerHTML = "";
    return;
  }
  const rows = [
    ["行动", "action"],
    ["用途", "claims"],
    ["证据", "tier"],
    ["结论", "verdict"],
    ["目标", "targets"],
    ["谨慎", "risks"],
    ["剂量", "dose"],
    ["冲突", "interactions"],
    ["证据点", "evidence"]
  ];
  compareTable.innerHTML = `<table class="compare-table">
    <thead><tr><th></th>${foods.map(f=>`<th>${esc(f.name)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(([label,key])=>`<tr><th>${esc(label)}</th>${foods.map(f=>`<td>${esc(compareCell(f,key))}</td>`).join("")}</tr>`).join("")}</tbody>
  </table>`;
}

function toggleCompare(name){
  if(state.compare.includes(name)){
    state.compare = state.compare.filter(x=>x!==name);
  }else{
    state.compare = state.compare.concat(name);
    if(state.compare.length>4) state.compare = state.compare.slice(state.compare.length-4);
  }
  renderCompare();
  syncUrl();
}

function syncUrl(){
  const params = new URLSearchParams();
  if(state.q.trim()) params.set("q", state.q.trim());
  if(state.tier!=="all") params.set("tier", state.tier);
  if(state.target!=="all") params.set("target", state.target);
  if(state.risk!=="all") params.set("risk", state.risk);
  if(state.mode==="compact") params.set("view", "compact");
  if(state.profileTarget!=="all") params.set("mine", state.profileTarget);
  if(state.profileRisks.length) params.set("risks", state.profileRisks.join("|"));
  if(state.compare.length) params.set("compare", state.compare.join("|"));
  const query = params.toString();
  history.replaceState(null, "", `${location.pathname}${query ? `?${query}` : ""}`);
}

function apply({sync=true}={}){
  let shown = 0;
  model.forEach(m=>{
    const show = matches(m);
    m.el.classList.toggle("hide", !show);
    if(show) shown++;
  });
  noResults.style.display = shown===0 ? "block" : "none";
  countEl.textContent = (shown===model.length) ? `共 ${model.length} 种食物` : `显示 ${shown} / ${model.length} 种`;
  updateFilterCounts();
  updateSummary();
  renderProfile();
  renderCompare();
  if(sync) syncUrl();
}

function clearFilters(){
  state.q = "";
  qInput.value = "";
  setGroup("tier", "all");
  setGroup("target", "all");
  setGroup("risk", "all");
  setProfileTarget("all");
  state.profileRisks = [];
  document.querySelectorAll("[data-profile-risk]").forEach(b=>{
    b.classList.remove("active");
    b.setAttribute("aria-pressed", "false");
  });
  apply();
}

function restoreFromUrl(){
  const params = new URLSearchParams(location.search);
  state.q = params.get("q") || "";
  qInput.value = state.q;
  setGroup("tier", params.get("tier") || "all");
  setGroup("target", params.get("target") || "all");
  setGroup("risk", params.get("risk") || "all");
  setMode(params.get("view")==="compact" ? "compact" : "full");
  setProfileTarget(params.get("mine") || "all");
  const urlRisks = (params.get("risks") || "").split("|").filter(Boolean);
  const validRisks = new Set(Array.from(document.querySelectorAll("[data-profile-risk]")).map(b=>b.dataset.profileRisk));
  state.profileRisks = urlRisks.filter(r=>validRisks.has(r));
  document.querySelectorAll("[data-profile-risk]").forEach(b=>{
    const on = state.profileRisks.includes(b.dataset.profileRisk);
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  state.compare = (params.get("compare") || "").split("|").filter(n=>foodByName.has(n)).slice(0,4);
}

document.querySelectorAll(".fgroup").forEach(group=>{
  group.addEventListener("click", e=>{
    const btn = e.target.closest("button[data-g]");
    if(!btn) return;
    setGroup(btn.dataset.g, btn.dataset.v);
    apply();
  });
});

qInput.addEventListener("input", e=>{ state.q = e.target.value; apply(); });
clearBtn.addEventListener("click", clearFilters);
clearEmptyBtn.addEventListener("click", clearFilters);
viewButtons.forEach(btn=>btn.addEventListener("click", ()=>{
  setMode(btn.dataset.mode);
  apply();
}));
document.querySelector(".profile-target").addEventListener("click", e=>{
  const btn = e.target.closest("[data-profile-target]");
  if(!btn) return;
  setProfileTarget(btn.dataset.profileTarget);
  apply();
});
document.querySelector(".profile-risks").addEventListener("click", e=>{
  const btn = e.target.closest("[data-profile-risk]");
  if(!btn) return;
  toggleProfileRisk(btn.dataset.profileRisk);
  apply();
});
grid.addEventListener("click", e=>{
  const btn = e.target.closest("[data-compare]");
  if(!btn) return;
  toggleCompare(btn.dataset.compare);
});
clearCompareBtn.addEventListener("click", ()=>{
  state.compare = [];
  renderCompare();
  syncUrl();
});
copyBtn.addEventListener("click", async ()=>{
  syncUrl();
  const old = copyBtn.textContent;
  try{
    if(!navigator.clipboard) throw new Error("Clipboard API unavailable");
    await navigator.clipboard.writeText(location.href);
    copyBtn.textContent = "已复制";
  }catch(e){
    copyBtn.textContent = "地址已更新";
  }
  window.setTimeout(()=>{ copyBtn.textContent = old; }, 1400);
});

restoreFromUrl();
apply();

// 渐进式展开：默认折叠「更多筛选」和「按我的情况看」，保持默认视图干净
(function(){
  const moreFilters = document.getElementById("more-filters");
  const profilePanel = document.getElementById("profile-panel");
  const tFilters = document.getElementById("toggle-filters");
  const tProfile = document.getElementById("toggle-profile");
  const badge = document.getElementById("filter-count");
  function setOpen(panel, btn, open){
    panel.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    btn.classList.toggle("active", open);
  }
  tFilters.addEventListener("click", ()=> setOpen(moreFilters, tFilters, !moreFilters.classList.contains("open")));
  tProfile.addEventListener("click", ()=> setOpen(profilePanel, tProfile, !profilePanel.classList.contains("open")));
  const ACTIVE_FILTER_SEL = '.fgroup[data-group="target"] button.active:not([data-v="all"]), .fgroup[data-group="risk"] button.active:not([data-v="all"])';
  function updateBadge(){
    const n = document.querySelectorAll(ACTIVE_FILTER_SEL).length;
    badge.textContent = n ? " " + n : "";
    tFilters.classList.toggle("has-active", n>0);
  }
  document.querySelector(".controls").addEventListener("click", updateBadge);
  const q = document.getElementById("q");
  if(q) q.addEventListener("input", updateBadge);
  // 初始：若 URL 已恢复出激活的筛选/筛查，自动展开对应面板（不偷偷藏起来）
  updateBadge();
  if(document.querySelector(ACTIVE_FILTER_SEL)) setOpen(moreFilters, tFilters, true);
  if(document.querySelector('[data-profile-target].active:not([data-profile-target="all"]), [data-profile-risk].active')) setOpen(profilePanel, tProfile, true);
})();
</script>
</body>
</html>
